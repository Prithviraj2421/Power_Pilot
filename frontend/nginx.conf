server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames change on every build, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or a browser keeps loading old asset
    # names after a deploy and the app breaks in a way that looks random.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Proxy the API so the browser sees one origin and CORS never applies.
    # "backend" is the service name from docker-compose.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A cold analysis runs the full 12-stage pipeline; the default 60s read
        # timeout would cut off a large upload mid-analysis.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 50m;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
    }

    # Client-side routing: unknown paths are React Router's, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
